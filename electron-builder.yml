appId: kz.turan.carrental
productName: Прокат автомобилей
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
  - build/icon.png
asarUnpack:
  - node_modules/better-sqlite3/**/*
npmRebuild: false
win:
  icon: build/icon.ico
  target: nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Прокат автомобилей
  artifactName: Прокат-автомобилей-Setup-${version}.exe
